[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudcost"
version = "0.1.0"
description = "Cost-aware thresholding and calibration for fraud-detection models"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Praveen Kumar Polisetty", email = "praveen.polisetty2123@gmail.com" }]
keywords = ["fraud-detection", "cost-sensitive", "calibration", "imbalanced", "aml"]
dependencies = ["numpy>=1.21", "scikit-learn>=1.0"]

[project.urls]
Homepage = "https://github.com/praveenpolisetty/fraudcost"
Repository = "https://github.com/praveenpolisetty/fraudcost"

[project.optional-dependencies]
examples = ["pandas>=1.3", "lightgbm>=3.3", "matplotlib>=3.4"]
